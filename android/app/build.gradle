plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
def ENV = System.getenv()

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keyFile = ENV['ANDROID_KEY_FILE']

def buildNumber = flutterVersionCode.toInteger()
/*
if (ENV['DRONE_BUILD_NUMBER'] != null) {
    buildNumber = ENV['DRONE_BUILD_NUMBER'].toInteger()
}

def tag = ENV['DRONE_TAG']
if(tag != null) {
    flutterVersionName = tag
}
*/



print flutterVersionName
print ":"
println buildNumber

def keystoreProperties = new Properties()
def keystorePropertiesFile = file(keyFile)
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 34
    buildToolsVersion "35.0.0"
    ndkVersion flutter.ndkVersion

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lintOptions {
        checkReleaseBuilds false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.github.lamarios.clipious"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode buildNumber
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.github.lamarios.clipious'
}

flutter {
    source '../..'
}

// work-runtime 2.10.0+ requires compileSdk 35, which triggers an aapt2
// incompatibility with the Nix-provided android-35 platform jar (the nixpkgs
// build-tools 35.0.0 aapt2 binary cannot parse android-35's resource table
// in AGP's link mode). Pin to 2.9.1 — the last release requiring compileSdk 34 —
// until nixpkgs ships a fixed aapt2. See TODO-UPGRADE.md for removal steps.
configurations.all {
    resolutionStrategy {
        force 'androidx.work:work-runtime:2.9.1'
        force 'androidx.work:work-runtime-ktx:2.9.1'
    }
}

