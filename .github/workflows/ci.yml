name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.3'
          channel: stable
      - name: Fetch locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: dart analyze --no-fatal-warnings lib
      - name: Run offline tests
        run: >-
          flutter test --no-pub
          test/bug_report_test.dart test/comments test/player test/utils
          test/videos/chapter_test.dart test/videos/views/chapter_list_test.dart
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libmpv-dev libepoxy-dev libasound2-dev libjson-glib-dev
      - name: Build Linux app
        run: flutter build linux --debug --no-pub
