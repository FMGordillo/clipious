name: Android release APKs

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-apk:
    if: github.repository == 'FMGordillo/clipious' && !github.event.deleted
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.3'
          channel: stable
      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          'platforms;android-33' 'platforms;android-34' 'platforms;android-35' 'platforms;android-36'
          'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Fetch locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build signed split APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_PROPERTIES_BASE64" ]]; then
            echo '::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES_BASE64 repository secrets.'
            exit 1
          fi
          signing_dir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          printf '%s' "$ANDROID_KEY_PROPERTIES_BASE64" | base64 --decode > "$signing_dir/key.properties"
          printf '\nstoreFile=%s/release.jks\n' "$signing_dir" >> "$signing_dir/key.properties"
          unset ANDROID_KEYSTORE_BASE64 ANDROID_KEY_PROPERTIES_BASE64
          ANDROID_KEY_FILE="$signing_dir/key.properties" flutter build apk --release --split-per-abi --no-pub
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk '/^version: / {print $2; exit}' pubspec.yaml)
          gh release create "ci-$GITHUB_RUN_NUMBER" --target "$GITHUB_SHA" --prerelease \
            --title "Clipious $version (${GITHUB_SHA::7})" \
            build/app/outputs/flutter-apk/*-release.apk
